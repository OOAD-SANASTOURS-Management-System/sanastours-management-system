spring.application.name=backend

# SECURITY NOTE: the database password below falls back to a value that was
# committed to this repository. Set the DB_PASSWORD environment variable on
# each machine and delete the ':...' fallback before sharing this project or
# putting it anywhere public. The same applies to jwt.secret further down.
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sanastours_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:20242424}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Force Hibernate to convert camelCase to underscores (e.g. TourPackage -> tour_package)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Server port
server.port=8081

# Payment slip uploads. The default cap is 1MB per file, which rejects most
# scanned bank slips; PaymentController enforces the same 5MB limit with a
# readable message.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Signing key for session tokens. JwtUtil falls back to a default development
# key when this is unset, which would let anyone forge a token - set a long
# random value per environment.
jwt.secret=${JWT_SECRET:changeMeToALongRandomValueForLocalDevelopmentOnly1234567890}
